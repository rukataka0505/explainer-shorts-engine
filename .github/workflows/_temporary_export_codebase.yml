name: Temporary codebase export

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Remove temporary workflow from package
        run: rm -f .github/workflows/_temporary_export_codebase.yml
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: explainer-shorts-engine-main
          path: .
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
